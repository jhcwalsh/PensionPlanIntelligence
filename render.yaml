services:
  # ---------------------------------------------------------------------------
  # Streamlit web app — primary public surface.
  # Owns the /data persistent disk (the SQLite DB lives there).
  # ---------------------------------------------------------------------------

  - type: web
    name: pension-plan-intelligence
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    disk:
      name: pension-db
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: DB_PATH
        value: /data/pension.db
      - key: DOWNLOADS_DIR
        value: /data/downloads
      - key: APP_BASE_URL
        value: https://pensionplanintelligence.onrender.com
      # Email sending — subscriber confirmation, welcome, digest fan-out
      # and approval-link clicks all send mail from the Streamlit process.
      # Values live in the Render dashboard; declared here so a missing
      # var fails the deploy instead of silently breaking sign-ups.
      - key: RESEND_API_KEY
        sync: false
      - key: APPROVAL_EMAIL_FROM
        sync: false
      - key: APPROVAL_EMAIL_RECIPIENT
        sync: false

  # ---------------------------------------------------------------------------
  # Staging — the same app on Postgres, for the step-4 dual run. Read-only
  # against Neon: no cadence, cron or pipeline points here. Delete this
  # service once step 5 cuts production over.
  #
  # No disk, deliberately. DATABASE_URL is the only thing making this Postgres
  # rather than SQLite, and without it database.resolve_database_url() falls
  # back to DB_PATH — which on a diskless service is an empty ephemeral file.
  # That failure looks like total data loss rather than a missing variable, so
  # check the variable first if this service ever comes up empty.
  #
  # No email vars: staging must never send. The cadences are not wired to it,
  # and a missing RESEND_API_KEY is a second line of defence if one ever is.
  # ---------------------------------------------------------------------------
  - type: web
    name: pension-plan-intelligence-staging
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_BASE_URL
        value: https://pension-plan-intelligence-staging.onrender.com
      - key: ADMIN_PASSWORD
        sync: false

# ---------------------------------------------------------------------------
# The FastAPI service (pension-rfp-api) was removed on 2026-08-16 along with
# the RFP subsystem it served. Streamlit is the only Render service.
#
# Nothing cron-shaped runs on Render: Render cron jobs cannot mount persistent
# disks, so their writes would be ephemeral and invisible to the web service.
# All scheduled work runs from GitHub Actions instead — see
# .github/workflows/ and the cadence table in CLAUDE.md.
#
# Next: migrate db/pension.db → managed Postgres, per
# docs/superpowers/specs/2026-08-16-low-maintenance-app-design.md. That
# removes the persistent disk, the DB-in-git deploy mechanism, and the
# 100 MB single-file ceiling in one step.
# ---------------------------------------------------------------------------
