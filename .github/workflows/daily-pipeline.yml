name: Daily pipeline (GHA edition)

# Fetch + extract + summarize for the reachable plans (137 of 148). The
# WAF-blocked plans in data/waf_blocked_plans.json are skipped everywhere --
# they used to run from a local Task Scheduler task, removed 2026-08-16.
# Runs daily at 11:00 UTC (~7 AM EDT / 6 AM EST) and on manual dispatch.
#
# Manual dispatch defaults to actually pushing the resulting db/pension.db.
# Tick "Skip the final commit/push" for a debug run that exercises
# fetch/extract/summarize without committing the result.

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC daily = 7 AM EDT / 6 AM EST
  workflow_dispatch:
    inputs:
      plan_ids:
        description: "Optional plan IDs (space-separated). Blank = all GHA-eligible plans."
        required: false
        default: ""
      dry_run:
        description: "Skip the final commit/push of db/pension.db"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# Prevent overlap between a scheduled run and a manual one. Queue rather
# than cancel -- losing a partial pipeline run could leave half-extracted
# documents in the DB.
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - name: Verify ANTHROPIC_API_KEY is set
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY repository secret is empty or unset."
            echo "Fix: Settings → Secrets and variables → Actions → Repository secrets."
            echo "The name must be exactly ANTHROPIC_API_KEY (case-sensitive)."
            exit 1
          fi
          echo "ANTHROPIC_API_KEY is present (length: ${#KEY} chars)"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pipeline.txt

      - name: Install Playwright Chromium with system deps
        run: python -m playwright install --with-deps chromium

      - name: Pull DB from R2
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m scripts.db_sync pull

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline.py ${{ github.event.inputs.plan_ids }}

      # Every step from here down carries `if: ${{ !cancelled() }}` so that a
      # failure in the pipeline or in either derived-data build cannot discard
      # the day's work. pipeline.py fetches, extracts and summarises 137 plans
      # and writes as it goes; without the guard a single plan's data quirk
      # skips the commit step and the whole run is thrown away with the
      # runner. This mirrors pipeline.py's own stated principle that "a data
      # quirk must not block the day's DB push". The job still reports failure,
      # so nothing becomes invisible — only the discarding is removed.
      - name: Pipeline status
        if: ${{ !cancelled() }}
        run: python pipeline.py --status

      - name: Rebuild manager rosters
        if: ${{ !cancelled() }}
        run: python -m scripts.build_manager_roster

      - name: Build twin snapshots
        if: ${{ !cancelled() }}
        run: python twin_builder.py

      - name: Push DB to R2
        if: ${{ !cancelled() && github.event.inputs.dry_run != 'true' }}
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m scripts.db_sync push --by "${{ github.workflow }}"

      - name: Daily DB snapshot to R2
        if: ${{ !cancelled() && github.event.inputs.dry_run != 'true' }}
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m scripts.db_sync snapshot

      # Skip only when the manual dispatch explicitly checks "dry_run".
      # Scheduled runs have no inputs (dry_run is empty/null), so this
      # condition is true for cron and for unchecked manual runs.
      - name: Commit DB changes
        if: ${{ !cancelled() && github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/pension.db
          if git diff --staged --quiet; then
            echo "No DB changes to commit."
          else
            git commit -m "Pipeline run $(date -u +%Y-%m-%d) [GHA]"
            if ! git push; then
              echo "Push rejected; rebasing on origin/master and retrying."
              git fetch origin master
              if ! git rebase origin/master; then
                echo "::error::Rebase conflict during push retry; aborting."
                git rebase --abort
                exit 1
              fi
              git push
            fi
          fi

      # The digest email used to be sent from here too, via
      # scripts/send_daily_digest.py. That was a second, redundant digest
      # alongside daily-digest.yml's `insights.scheduler daily`, and its one
      # distinctive feature — regex RFP/consultant alerts from
      # lib/rfp_alerts.py — went with the RFP subsystem on 2026-08-16.
      # daily-digest.yml is now the only digest: it has lookback state in
      # daily_runs and the volume/keyword/reappearing-plan trigger rules.
