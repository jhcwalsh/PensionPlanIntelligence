name: Daily pipeline (GHA edition)

# Fetch + extract + summarize for the reachable plans (137 of 148). The
# WAF-blocked plans in data/waf_blocked_plans.json are skipped everywhere --
# they used to run from a local Task Scheduler task, removed 2026-08-16.
# Runs daily at 11:00 UTC (~7 AM EDT / 6 AM EST) and on manual dispatch.
#
# Writes straight to Postgres as it goes. There is no longer a final
# commit to skip, so the old "dry_run" dispatch input is gone rather than
# left in place doing nothing: pipeline.py has no read-only mode.

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC daily = 7 AM EDT / 6 AM EST
  workflow_dispatch:
    inputs:
      plan_ids:
        description: "Optional plan IDs (space-separated). Blank = all GHA-eligible plans."
        required: false
        default: ""

permissions:
  contents: write

# Prevent overlap between a scheduled run and a manual one. Queue rather
# than cancel -- losing a partial pipeline run could leave half-extracted
# documents in the DB.
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # Every step in this job talks to the same Postgres. Declared at job
    # level rather than per step so a new step cannot silently fall back
    # to SQLite: database.resolve_database_url() treats an unset or empty
    # DATABASE_URL as "use DB_PATH", which on a runner is an empty file —
    # the job would appear to succeed having read and written nothing.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Verify ANTHROPIC_API_KEY is set
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY repository secret is empty or unset."
            echo "Fix: Settings → Secrets and variables → Actions → Repository secrets."
            echo "The name must be exactly ANTHROPIC_API_KEY (case-sensitive)."
            exit 1
          fi
          echo "ANTHROPIC_API_KEY is present (length: ${#KEY} chars)"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pipeline.txt

      - name: Install Playwright Chromium with system deps
        run: python -m playwright install --with-deps chromium

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline.py ${{ github.event.inputs.plan_ids }}

      # `!cancelled()` survives the Postgres cutover with a narrower job.
      # It no longer protects a commit — the pipeline's rows are durable the
      # moment they are written. It now protects the *derived-data* builds:
      # the extractors exit 1 when any single item fails, and one plan's data
      # quirk should not leave the manager rosters and twin snapshots a day
      # stale. The job still reports failure, so nothing becomes invisible.
      - name: Pipeline status
        if: ${{ !cancelled() }}
        run: python pipeline.py --status

      - name: Rebuild manager rosters
        if: ${{ !cancelled() }}
        run: python -m scripts.build_manager_roster

      - name: Build twin snapshots
        if: ${{ !cancelled() }}
        run: python twin_builder.py
