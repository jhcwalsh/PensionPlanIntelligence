name: daily-digest

on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC daily — ~9am ET (EST) / 8am ET (EDT)
  workflow_dispatch:
    inputs:
      mode:
        description: "INSIGHTS_MODE (mock for dry-run, live for real send)"
        required: false
        default: "live"
        type: choice
        options:
          - live
          - mock

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      INSIGHTS_MODE: ${{ github.event.inputs.mode || 'live' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      APPROVAL_EMAIL_FROM: ${{ secrets.APPROVAL_EMAIL_FROM }}
      APPROVAL_EMAIL_RECIPIENT: ${{ secrets.APPROVAL_EMAIL_RECIPIENT }}
      APPROVAL_BASE_URL: https://pensionplanintelligence.onrender.com

    # Every step in this job talks to the same Postgres. Declared at job
    # level rather than per step so a new step cannot silently fall back
    # to SQLite: database.resolve_database_url() treats an unset or empty
    # DATABASE_URL as "use DB_PATH", which on a runner is an empty file —
    # the job would appear to succeed having read and written nothing.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pipeline.txt

      - name: Verify required secrets are set
        run: |
          missing=()
          [ -z "$ANTHROPIC_API_KEY" ] && missing+=("ANTHROPIC_API_KEY")
          [ -z "$RESEND_API_KEY" ] && missing+=("RESEND_API_KEY")
          [ -z "$APPROVAL_EMAIL_FROM" ] && missing+=("APPROVAL_EMAIL_FROM")
          [ -z "$APPROVAL_EMAIL_RECIPIENT" ] && missing+=("APPROVAL_EMAIL_RECIPIENT")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required secrets: ${missing[*]}"
            echo "Set them in Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "All required secrets present."

      - name: Send daily digest
        run: python -m insights.scheduler daily

      # `!cancelled()`: the daily cadence auto-sends on quiet/normal days via
      # cycle_common.finalize_and_send, and the daily_runs row it writes is
      # what anchors the next run's lookback (MAX(sent_at)). If a later step
      # fails and the commit is skipped, the digest has gone out but the
      # lookback state has not, so tomorrow's digest repeats today's documents.