name: Monthly IPS refresh

# Auto-discovers and fetches each plan's Investment Policy Statement, then
# extracts structured allocation targets from it. Each candidate is gated by a
# Haiku 4.5 verification call so adjacent policy documents (proxy voting,
# securities lending) don't pollute the table. Hash-deduplicated: re-runs are
# no-ops when nothing changed, and a genuinely new IPS lands as a new
# ips_documents row.
#
# Moved here from local Windows Task Scheduler (scripts/run_ips.bat) on
# 2026-08-16, so no machine of James's is in the path of the app working.
# No Playwright — the IPS path uses plain HTTP.
#
# Runs the 1st of each month at 16:00 UTC, between monthly-cafr-refresh
# (15:00) and monthly-insights (18:00), so a single monthly DB state feeds
# the briefing.

on:
  schedule:
    - cron: "0 16 1 * *"   # 1st of every month at 16:00 UTC
  workflow_dispatch:
    inputs:
      plan_ids:
        description: "Optional plan IDs (space-separated). Blank = all plans."
        required: false
        default: ""
      discover_only:
        description: "Dry run — discover candidate URLs without saving"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: monthly-ips
  cancel-in-progress: false

jobs:
  ips:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Every step in this job talks to the same Postgres. Declared at job
    # level rather than per step so a new step cannot silently fall back
    # to SQLite: database.resolve_database_url() treats an unset or empty
    # DATABASE_URL as "use DB_PATH", which on a runner is an empty file —
    # the job would appear to succeed having read and written nothing.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Verify ANTHROPIC_API_KEY is set
        env:
          ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC" ]; then
            echo "::error::Missing repository secret ANTHROPIC_API_KEY"
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pipeline.txt

      - name: Refresh IPS documents
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.discover_only }}" = "true" ]; then
            FLAGS="--discover-only"
          fi
          python refresh_ips.py $FLAGS ${{ github.event.inputs.plan_ids }}

      # Both IPS scripts exit 1 when ANY single plan or document fails, and
      # refresh_ips writes rows as it goes. Every step from here down carries
      # `if: ${{ !cancelled() }}` so one plan's bad URL cannot discard the
      # month's work — the job still reports failure. Same rule as every other
      # cadence; see CLAUDE.md.
      - name: Extract IPS allocation targets
        if: ${{ !cancelled() && github.event.inputs.discover_only != 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python extract_ips.py

      - name: Build twin snapshots
        if: ${{ !cancelled() && github.event.inputs.discover_only != 'true' }}
        run: python twin_builder.py
