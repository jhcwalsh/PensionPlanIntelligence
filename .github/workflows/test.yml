name: tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LLM_MODE: mock
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pipeline.txt
          pip install pytest pytest-asyncio "moto[s3]"

      - name: Run tests
        run: pytest tests/ -q --tb=short

  # Postgres semantics that SQLite physically cannot test: TIMESTAMPTZ
  # round-trips today, tsvector search once it lands. Separate job so the
  # fast SQLite suite is not gated on a service container starting.
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LLM_MODE: mock
      INSIGHTS_MODE: mock
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/pension_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pension_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pipeline.txt
          pip install pytest

      - name: Run Postgres tests
        run: pytest tests/postgres -v --tb=short
