name: Weekly insights (GHA edition)

# Composes the weekly Insights digest SILENTLY: no email, no notes/ file,
# no approval. Nobody receives a weekly briefing any more.
#
# This workflow survives the 2026-08-16 cadence cut because the weekly
# Publication row is the input monthly composes from —
# insights/monthly._gather_approved_weeklies raises outright when it finds
# no weeklies for its period. Deleting this would silently break the
# monthly briefing a month later.
#
# Pure composition — uses documents already in the DB (--skip-scrape).
# Runs Sundays at 12:30 UTC, staggered after daily-pipeline (11:00 UTC).

on:
  schedule:
    - cron: "30 12 * * 0"  # Sundays at 12:30 UTC = 8:30 AM EDT / 7:30 AM EST
  workflow_dispatch:
    inputs:
      period:
        description: "Week start (Sunday) in YYYY-MM-DD. Blank = auto-pick most recently ended week."
        required: false
        default: ""
      force:
        description: "Re-compose + re-send even if a publication exists for this period."
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Skip the final commit/push of notes/"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weekly-insights
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Every step in this job talks to the same Postgres. Declared at job
    # level rather than per step so a new step cannot silently fall back
    # to SQLite: database.resolve_database_url() treats an unset or empty
    # DATABASE_URL as "use DB_PATH", which on a runner is an empty file —
    # the job would appear to succeed having read and written nothing.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Verify required secrets are set
        env:
          ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND: ${{ secrets.RESEND_API_KEY }}
        run: |
          missing=()
          [ -z "$ANTHROPIC" ] && missing+=("ANTHROPIC_API_KEY")
          [ -z "$RESEND" ] && missing+=("RESEND_API_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secret(s): ${missing[*]}"
            echo "Fix: Settings → Secrets and variables → Actions → Repository secrets."
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pipeline.txt

      - name: Compose weekly insights (silent — feeds monthly)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APPROVAL_EMAIL_RECIPIENT: ${{ secrets.APPROVAL_EMAIL_RECIPIENT }}
          APPROVAL_EMAIL_FROM: ${{ secrets.APPROVAL_EMAIL_FROM }}
          INSIGHTS_MODE: live
        run: |
          ARGS="--skip-scrape"
          if [ -n "${{ github.event.inputs.period }}" ]; then
            ARGS="$ARGS --period ${{ github.event.inputs.period }}"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python -m insights.scheduler weekly $ARGS

      # `!cancelled()`: the weekly publication row is what monthly reads. If
      # a later step fails and the commit is skipped, the row is lost with the
      # runner and next month's briefing has one fewer week to synthesize —
      # or none at all, which makes monthly raise.
      - name: Commit notes
        if: ${{ !cancelled() && github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes/
          if git diff --staged --quiet; then
            echo "No notes changes to commit."
          else
            git commit -m "Weekly insights $(date -u +%Y-%m-%d) [GHA]"
            if ! git push; then
              echo "Push rejected; rebasing on origin/master and retrying."
              git fetch origin master
              if ! git rebase origin/master; then
                echo "::error::Rebase conflict during push retry; aborting."
                git rebase --abort
                exit 1
              fi
              git push
            fi
          fi
