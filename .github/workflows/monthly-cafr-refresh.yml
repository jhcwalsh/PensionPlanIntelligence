name: Monthly CAFR refresh (GHA edition)

# Pulls each plan's most-recently-closed-FY ACFR into the DB. Idempotent:
# already_have rows are no-ops, so re-runs are cheap. The 5 WAF-blocked
# CAFR sources are skipped entirely (data/waf_blocked_cafr_plans.json);
# the rest run from GHA.
#
# Runs the 1st of every month at 15:00 UTC (~11 AM EDT / 10 AM EST).
# Deliberately scheduled BEFORE monthly-insights (1st @ 18:00 UTC) so any
# new CAFRs land in the DB before insights composes its monthly digest.

on:
  schedule:
    - cron: "0 15 1 * *"   # 1st of every month at 15:00 UTC
  workflow_dispatch:
    inputs:
      plan_ids:
        description: "Optional plan IDs (space-separated). Blank = all GHA-eligible plans."
        required: false
        default: ""
      year:
        description: "Override target fiscal year (default: computed per plan)"
        required: false
        default: ""
      dry_run:
        description: "Skip the final commit/push of data/asset_class_mappings.json"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: monthly-cafr-refresh
  cancel-in-progress: false

jobs:
  cafr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Every step in this job talks to the same Postgres. Declared at job
    # level rather than per step so a new step cannot silently fall back
    # to SQLite: database.resolve_database_url() treats an unset or empty
    # DATABASE_URL as "use DB_PATH", which on a runner is an empty file —
    # the job would appear to succeed having read and written nothing.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pipeline.txt

      - name: Run CAFR refresh
        run: |
          YEAR_FLAG=""
          if [ -n "${{ github.event.inputs.year }}" ]; then
            YEAR_FLAG="--year ${{ github.event.inputs.year }}"
          fi
          python refresh_cafrs.py $YEAR_FLAG ${{ github.event.inputs.plan_ids }}

      # Structured extraction MUST run in the same job as the refresh —
      # extract_cafr_investments.py opens the PDF binary at doc.local_path
      # for page-targeted extraction, and PDFs aren't committed to git.
      # If this step moved to monthly-insights.yml on a different runner,
      # all freshly-downloaded CAFRs would silently fail with "missing_file".
      - name: Extract CAFR investment data
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python extract_cafr_investments.py

      # Every step from here down carries `if: ${{ !cancelled() }}`. These
      # extractors exit 1 when ANY single document fails (one Claude error
      # surviving tenacity's 3 retries out of ~138 docs is enough), and the
      # PDFs they read live only on this runner — they are never committed.
      # Without the guard, one bad document skips the commit step and throws
      # away the whole month's refresh. The job still goes red so the failure
      # stays visible; only the "discard everything" behaviour is removed.
      - name: Extract CAFR actuarial data
        if: ${{ !cancelled() }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python extract_cafr_actuarial.py

      - name: Refresh asset-class mappings
        if: ${{ !cancelled() }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m scripts.normalize_asset_classes

      - name: Build twin snapshots
        if: ${{ !cancelled() }}
        run: python twin_builder.py

      - name: Commit asset-class mappings
        if: ${{ !cancelled() && github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/asset_class_mappings.json
          if git diff --staged --quiet; then
            echo "No mapping changes to commit."
          else
            git commit -m "Monthly CAFR refresh $(date -u +%Y-%m-%d) [GHA]"
            if ! git push; then
              echo "Push rejected; rebasing on origin/master and retrying."
              git fetch origin master
              if ! git rebase origin/master; then
                echo "::error::Rebase conflict during push retry; aborting."
                git rebase --abort
                exit 1
              fi
              git push
            fi
          fi
