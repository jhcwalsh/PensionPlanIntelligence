name: Annual insights (GHA edition)

# Composes a year-in-review CIO Insight digest, auto-publishes it to
# notes/, and emails a copy. No approval step. Pure composition — uses
# published monthly publications already in the DB. No Playwright.
#
# Runs Jan 5 at 19:00 UTC — a few days after monthly-insights and
# quarterly-insights (both Jan 1) so December's monthly and the Q4
# quarterly can be approved before the annual synthesizes the year.
#
# Partial years are fine: 2026 production starts in April, so the
# first run (Jan 2027, targeting 2026) synthesizes 9 monthlies.

on:
  schedule:
    - cron: "0 19 5 1 *"   # Jan 5 at 19:00 UTC
  workflow_dispatch:
    inputs:
      year:
        description: "Override target year (default: prior calendar year)"
        required: false
        default: ""
      dry_run:
        description: "Skip the final commit/push of notes/"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: annual-insights
  cancel-in-progress: false

jobs:
  annual:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Every step in this job talks to the same Postgres. Declared at job
    # level rather than per step so a new step cannot silently fall back
    # to SQLite: database.resolve_database_url() treats an unset or empty
    # DATABASE_URL as "use DB_PATH", which on a runner is an empty file —
    # the job would appear to succeed having read and written nothing.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Verify required secrets are set
        env:
          ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND: ${{ secrets.RESEND_API_KEY }}
        run: |
          missing=()
          [ -z "$ANTHROPIC" ] && missing+=("ANTHROPIC_API_KEY")
          [ -z "$RESEND" ] && missing+=("RESEND_API_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secret(s): ${missing[*]}"
            echo "Fix: Settings → Secrets and variables → Actions → Repository secrets."
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pipeline.txt

      - name: Compose annual insights + auto-publish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APPROVAL_EMAIL_RECIPIENT: ${{ secrets.APPROVAL_EMAIL_RECIPIENT }}
          APPROVAL_EMAIL_FROM: ${{ secrets.APPROVAL_EMAIL_FROM }}
          INSIGHTS_MODE: live
        run: |
          if [ -n "${{ github.event.inputs.year }}" ]; then
            python -m insights.scheduler annual --year ${{ github.event.inputs.year }}
          else
            python -m insights.scheduler annual
          fi

      # `!cancelled()`: the compose step auto-publishes and emails before the
      # workflow commits, so skipping the commit on failure would leave a
      # briefing that was sent to readers but never recorded as published.
      - name: Commit notes
        if: ${{ !cancelled() && github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes/
          if git diff --staged --quiet; then
            echo "No notes changes to commit."
          else
            git commit -m "Annual insights $(date -u +%Y-%m-%d) [GHA]"
            git push
          fi
