name: Monthly insights (GHA edition)

# Composes the monthly Insights digest, auto-publishes it to notes/, and
# emails a copy. No approval step — nothing waits on a click.
#
# Runs the 1st of each month at 18:00 UTC (~2 PM EDT / 1 PM EST). Late
# in the day deliberately, so the local CAFR refresh has time to fire,
# push. Both write the same Postgres, so ordering is about data freshness,
# not about one job's commit reaching the other.

on:
  schedule:
    - cron: "0 18 1 * *"   # 1st of month at 18:00 UTC = 2 PM EDT / 1 PM EST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip the final commit/push of notes/ + cafr_summaries/"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: monthly-insights
  cancel-in-progress: false

jobs:
  monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Every step in this job talks to the same Postgres. Declared at job
    # level rather than per step so a new step cannot silently fall back
    # to SQLite: database.resolve_database_url() treats an unset or empty
    # DATABASE_URL as "use DB_PATH", which on a runner is an empty file —
    # the job would appear to succeed having read and written nothing.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Verify required secrets are set
        env:
          ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND: ${{ secrets.RESEND_API_KEY }}
        run: |
          missing=()
          [ -z "$ANTHROPIC" ] && missing+=("ANTHROPIC_API_KEY")
          [ -z "$RESEND" ] && missing+=("RESEND_API_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secret(s): ${missing[*]}"
            echo "Fix: Settings → Secrets and variables → Actions → Repository secrets."
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pipeline.txt

      - name: Compose monthly insights + auto-publish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APPROVAL_EMAIL_RECIPIENT: ${{ secrets.APPROVAL_EMAIL_RECIPIENT }}
          APPROVAL_EMAIL_FROM: ${{ secrets.APPROVAL_EMAIL_FROM }}
          INSIGHTS_MODE: live
        run: python -m insights.scheduler monthly

      # `!cancelled()`: the compose step auto-publishes and emails before the
      # workflow commits, so skipping the commit on failure would leave a
      # briefing that was sent to readers but never recorded as published.
      - name: Commit notes + cafr_summaries
        if: ${{ !cancelled() && github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes/ cafr_summaries/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Monthly insights $(date -u +%Y-%m-%d) [GHA]"
            if ! git push; then
              echo "Push rejected; rebasing on origin/master and retrying."
              git fetch origin master
              if ! git rebase origin/master; then
                echo "::error::Rebase conflict during push retry; aborting."
                git rebase --abort
                exit 1
              fi
              git push
            fi
          fi
